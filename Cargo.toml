[package]
name = "biggie"
version = "0.2.0"
edition = "2021"
rust-version = "1.77"
description = "Simplified Solana arbitrage bot for mid-tail tokens"

[dependencies]
# Core async runtime
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"

# Solana SDK
solana-sdk = "2"
solana-client = "2"
bincode = "1"
bs58 = "0.5"
base64 = "0.22"

# HTTP/WebSocket
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 1


